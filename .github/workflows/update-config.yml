name: Actualizar Configuracion

on:
  workflow_call:

jobs:
  update-config:
    name: Reemplazar cadena de conexion
    runs-on: ubuntu-latest

    steps:
      - name: Revision de código
        uses: actions/checkout@v4

      - name: Reemplazar DefaultConnection en appsettings.json
        shell: pwsh
        env:
          MYSQL_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET_INVENTARIOS }}
        run: |
          $configPath = "./Inventarios.Api/Inventarios.api/appsettings.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json

          Write-Host "Conexion original: $($config.ConnectionStrings.DefaultConnection)"

          $config.ConnectionStrings.DefaultConnection = "Server=localhost;Port=3306;Database=inventarios_db;User=root;Password=$env:MYSQL_PASSWORD;CharSet=utf8mb4;"
          $config.Jwt.SecretKey = $env:JWT_SECRET

          $config | ConvertTo-Json -Depth 10 | Set-Content $configPath

          $updated = Get-Content $configPath -Raw | ConvertFrom-Json
          Write-Host "Conexion actualizada: $($updated.ConnectionStrings.DefaultConnection)"

      - name: Subir appsettings modificado como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: appsettings-ci
          path: ./Inventarios.Api/Inventarios.api/appsettings.json