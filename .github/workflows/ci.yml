name: CI — Microservicio Inventarios y Productos

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ── Workflow reutilizable — Variables ─────────────────────────────
  configuracion:
    name: Configuracion y Variables
    uses: ./.github/workflows/variables.yml
    secrets: inherit

  # ── Workflow reutilizable — Actualizar config ─────────────────────
  actualizar-config:
    name: Actualizar appsettings.json
    needs: configuracion
    uses: ./.github/workflows/update-config.yml
    secrets: inherit
    

  # ── Build y Pruebas .NET ──────────────────────────────────────────
  build-dotnet:
    name: Build y Pruebas .NET 8
    runs-on: ubuntu-latest
    needs: [configuracion, actualizar-config]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: inventarios_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -p${{ secrets.MYSQL_ROOT_PASSWORD }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    steps:
      - name: Mostrar version recibida
        run: |
          echo "App: ${{ needs.configuracion.outputs.app_name }}"
          echo "Version .NET: ${{ needs.configuracion.outputs.dotnet_version }}"

      - name: Revision de código
        uses: actions/checkout@v4

      - name: Descargar appsettings.json actualizado
        uses: actions/download-artifact@v4
        with:
          name: appsettings-ci
          path: ./Inventarios.Api/Inventarios.api/

      - name: Verificar appsettings descargado
        shell: pwsh
        run: |
          $config = Get-Content "./Inventarios.Api/Inventarios.api/appsettings.json" -Raw | ConvertFrom-Json
          Write-Host "DefaultConnection: $($config.ConnectionStrings.DefaultConnection)"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ needs.configuracion.outputs.dotnet_version }}

      - name: Restaurar dependencias
        run: dotnet restore ./Inventarios.Api/Inventarios.api.sln

      - name: Compilar proyecto
        run: dotnet build ./Inventarios.Api/Inventarios.api.sln --configuration Release

      - name: Ejecutar pruebas unitarias
        run: |
          dotnet test ./Inventarios.Api/Inventarios.api.Test/Inventarios.api.Test.csproj \
            --configuration Release \
            --filter "FullyQualifiedName~UnitTest" \
            --logger "console;verbosity=detailed"

  # ── Build y Pruebas NestJS ────────────────────────────────────────
  build-nestjs:
    name: Build y Pruebas NestJS 11
    runs-on: ubuntu-latest
    needs: configuracion

    steps:
      - name: Mostrar version recibida
        run: |
          echo "App: ${{ needs.configuracion.outputs.app_name }}"
          echo "Version Node: ${{ needs.configuracion.outputs.node_version }}"

      - name: Revision de código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.configuracion.outputs.node_version }}
          cache: 'npm'
          cache-dependency-path: Inventarios.Api.Nest/productos.api/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: Inventarios.Api.Nest/productos.api

      - name: Compilar proyecto
        run: npm run build
        working-directory: Inventarios.Api.Nest/productos.api

      - name: Ejecutar pruebas unitarias
        run: npm run test:unit
        working-directory: Inventarios.Api.Nest/productos.api
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          DB_DATABASE: productos_db
          DB_REPLICA_HOST: localhost
          DB_REPLICA_PORT: 3306
          DB_REPLICA_DATABASE: productos_db
          JWT_SECRET: ${{ secrets.JWT_SECRET_PRODUCTOS }}
          JWT_EXPIRATION: "8h"
          PORT: 3001
          NODE_ENV: test

  # ── Build Docker ──────────────────────────────────────────────────
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build-dotnet, build-nestjs]

    steps:
      - name: Revision de código
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagen Inventarios API
        uses: docker/build-push-action@v5
        with:
          context: ./Inventarios.Api
          dockerfile: ./Inventarios.Api/Dockerfile
          push: false
          tags: inventarios-api:latest

      - name: Build imagen Productos API
        uses: docker/build-push-action@v5
        with:
          context: ./Inventarios.Api.Nest/productos.api
          dockerfile: ./Inventarios.Api.Nest/productos.api/dockerfile
          push: false
          tags: productos-api:latest

      - name: Validar docker-compose.yml
        run: docker compose config