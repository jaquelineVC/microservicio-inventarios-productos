name: CI — Microservicio Inventarios y Productos

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  TipoEjecucion: 'Integracion Continua'

jobs:

  # ── Mostrar Variables ─────────────────────────────────────────────
  mostrar-variables:
    name: Mostrar Variables del Proyecto
    runs-on: ubuntu-latest
    steps:
      - name: Mostrar Variables Todas
        env:
          mensaje: Iniciando pipeline de CI/CD
        run: |
          echo "Aplicacion: ${{ vars.APP_NAME }}"
          echo "Version .NET: ${{ vars.DOTNET_VERSION }}"
          echo "Version Node: ${{ vars.NODE_VERSION }}"
          echo "Tipo Ejecucion: $TipoEjecucion"
          echo $mensaje

      - name: Crear Variable
        run: echo "framework=NET.8" >> $GITHUB_ENV

      - name: Usar Variable
        run: echo $framework

      - name: Revision de código
        uses: actions/checkout@v4

  # ── Build y Pruebas .NET ──────────────────────────────────────────
  build-dotnet:
    name: Build y Pruebas .NET 8
    runs-on: ubuntu-latest
    needs: mostrar-variables

    steps:
      - name: Revision de código
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ vars.DOTNET_VERSION }}

      - name: Restaurar dependencias
        run: dotnet restore ./Inventarios.Api/Inventarios.api.sln

      - name: Compilar proyecto
        run: dotnet build ./Inventarios.Api/Inventarios.api.sln --configuration Release

      - name: Ejecutar pruebas unitarias
        run: |
          dotnet test ./Inventarios.Api/Inventarios.api.Test/Inventarios.api.Test.csproj \
            --configuration Release \
            --filter "FullyQualifiedName~UnitTest" \
            --logger "console;verbosity=detailed"
        env:
          Jwt__SecretKey: ${{ secrets.JWT_SECRET_INVENTARIOS }}
          Jwt__Issuer: "Inventarios.Api"
          Jwt__Audience: "Inventarios.Client"
          Jwt__ExpirationHours: "8"

  # ── Build y Pruebas NestJS ────────────────────────────────────────
  build-nestjs:
    name: Build y Pruebas NestJS 11
    runs-on: ubuntu-latest
    needs: mostrar-variables

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root1234
          MYSQL_DATABASE: productos_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot1234"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Revision de código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: Inventarios.Api.Nest/productos.api/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: Inventarios.Api.Nest/productos.api

      - name: Compilar proyecto
        run: npm run build
        working-directory: Inventarios.Api.Nest/productos.api

      - name: Ejecutar pruebas unitarias
        run: npm run test:unit
        working-directory: Inventarios.Api.Nest/productos.api
        env:
          DB_HOST: localhost
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          DB_DATABASE: productos_db
          DB_REPLICA_HOST: localhost
          DB_REPLICA_PORT: 3306
          DB_REPLICA_DATABASE: productos_db
          JWT_SECRET: ${{ secrets.JWT_SECRET_PRODUCTOS }}
          JWT_EXPIRATION: "8h"
          PORT: 3001
          NODE_ENV: test

  # ── Build Docker Images ───────────────────────────────────────────
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build-dotnet, build-nestjs]

    steps:
      - name: Revision de código
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagen Inventarios API
        uses: docker/build-push-action@v5
        with:
          context: ./Inventarios.Api
          dockerfile: ./Inventarios.Api/Dockerfile
          push: false
          tags: inventarios-api:latest

      - name: Build imagen Productos API
        uses: docker/build-push-action@v5
        with:
          context: ./Inventarios.Api.Nest/productos.api
          dockerfile: ./Inventarios.Api.Nest/productos.api/dockerfile
          push: false
          tags: productos-api:latest

      - name: Validar docker-compose.yml
        run: docker compose config